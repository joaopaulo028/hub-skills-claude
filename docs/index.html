<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="script-src 'self'; object-src 'none'; base-uri 'self';" />
  <title>Meu Hub de Skills do Claude</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- CSS modular: a ordem importa (tokens → base → components → responsive) -->
  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/header.css" />
  <link rel="stylesheet" href="styles/cards.css" />
  <link rel="stylesheet" href="styles/modal.css" />
  <link rel="stylesheet" href="styles/responsive.css" />
</head>
<body>

  <header class="header">
    <h1 class="header-title">Meu Hub de Skills do Claude</h1>
    <p class="header-subtitle">Inventário pessoal · curado por João Paulo</p>

    <div class="search-wrap">
      <span class="search-icon" aria-hidden="true">🔍</span>
      <input type="text" id="search" placeholder="Buscar skill..." autocomplete="off" aria-label="Buscar skill" />
    </div>

    <div class="filters" id="filters">
      <!-- chips renderizados via JS -->
    </div>
  </header>

  <main class="container">

    <section class="section">
      <h2 class="section-title">REPOSITÓRIOS BASE</h2>
      <div id="repos-grid" class="repos-grid"></div>
    </section>

    <section class="section">
      <h2 class="section-title">
        SKILLS
        <span class="section-count" id="results-count">0 resultados</span>
      </h2>
      <div id="skills-grid" class="skills-grid">
        <!-- cards renderizados via JS -->
      </div>
    </section>

  </main>

  <div id="modal" class="modal hidden" aria-hidden="true">
    <div class="modal-backdrop" data-close></div>
    <div class="modal-content" role="dialog" aria-modal="true">
      <button type="button" class="modal-close" id="modal-close" aria-label="Fechar">×</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <footer class="footer">
    <p>Meu Hub de Skills · Curadoria pessoal · 2026</p>
  </footer>

  <!-- Dados (define window.SKILLS_DATA) -->
  <script src="data/skills.js"></script>

  <!-- JS modular: a ordem importa (state e utils antes; main por último) -->
  <script src="scripts/state.js"></script>
  <script src="scripts/utils.js"></script>
  <script src="scripts/filters.js"></script>
  <script src="scripts/cards.js"></script>
  <script src="scripts/modal.js"></script>
  <script src="scripts/main.js"></script>
</body>
</html>
